version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /transcriber
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /importer
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/, /importer, /transcriber]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
