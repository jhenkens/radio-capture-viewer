name: pr-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Builds all three images (tsc and webpack run inside the app image) without pushing.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: app, context: . }
          - { name: importer, context: ./importer }
          - { name: transcriber, context: ./transcriber }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  # Merges Dependabot's minor/patch PRs once every build passes. Majors are ignored in
  # dependabot.yml and skipped here too, so they would wait for a human.
  automerge:
    needs: build
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-automerge
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash "$PR_URL"
          # A merge made with GITHUB_TOKEN does not trigger the push workflow, so start it.
          gh workflow run docker-publish.yml --ref main
