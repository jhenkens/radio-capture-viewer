name: ci

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

env:
  DOCKER_OWNER: johhenkens

jobs:
  docker:
    runs-on: ubuntu-latest
    # The three images are independent, so build them in parallel.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            prefix: ""
          - name: importer
            context: ./importer
            prefix: "importer-"
          - name: transcriber
            context: ./transcriber
            prefix: "transcriber-"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: "${{ env.DOCKER_OWNER }}/${{ github.event.repository.name }}"
          tags: |
            type=raw,value=${{ matrix.prefix }}latest,enable={{is_default_branch}}
            type=semver,pattern=${{ matrix.prefix }}{{version}}
            type=semver,pattern=${{ matrix.prefix }}{{major}}.{{minor}}
            type=semver,pattern=${{ matrix.prefix }}{{major}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
