name: secret-scan

on:
  push:
    branches:
      - "main"
  pull_request:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scans every commit reachable from the checkout, not just the tip, so a secret
      # that was committed and later deleted still fails the build.
      - name: Scan git history with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --no-banner --exit-code 1
